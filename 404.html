<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#070404;--panel:rgba(255,255,255,.035);--line:rgba(233,176,75,.16);--line-strong:rgba(233,176,75,.5);--gold:#e9b04b;--gold-soft:#f3cf8e;--ember:#ff5e2b;--ink:#f4e9d6;--copy:rgba(244,233,214,.82);--muted:rgba(244,233,214,.55);--btn-ink:#120a01}

  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:'Outfit',system-ui,sans-serif;line-height:1.75;min-height:100vh;display:flex;flex-direction:column;transition:background .5s,color .5s}
  a{color:var(--gold)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line);max-width:1100px;width:100%;margin:0 auto}

  .brand em{color:var(--gold);font-style:italic}
  .home-link{text-decoration:none;color:var(--copy)}
  main{flex:1;display:grid;place-items:center;padding:56px 24px 72px;text-align:center}
  .medallion{display:block;width:118px;height:118px;border-radius:50%;object-fit:cover;margin:0 auto 22px;box-shadow:0 14px 40px rgba(233,176,75,.22)}
  .code{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(4.5rem,15vw,7.5rem);line-height:1;font-weight:600;letter-spacing:.06em;color:var(--gold)}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:600;color:var(--gold-soft);margin:10px 0 8px}
  p{color:var(--copy);max-width:46ch;margin:0 auto 30px}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:12px 26px;border-radius:40px;text-decoration:none;font-weight:500;color:var(--gold);border:1px solid var(--line-strong);transition:transform .3s,border-color .3s}
  .btn:hover{transform:translateY(-2px);border-color:var(--gold)}
  .btn-fill{background:linear-gradient(135deg,var(--gold),var(--ember));color:var(--btn-ink);border-color:transparent}
  footer{border-top:1px solid var(--line);text-align:center;padding:26px 16px;color:var(--muted);font-size:.85rem;line-height:2}
  footer a{color:var(--copy);margin:0 8px;text-decoration:none}
